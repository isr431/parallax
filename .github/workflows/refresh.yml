name: Refresh data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      fail_source:
        description: Optional source stub to fail for partial-success verification
        required: false
        type: choice
        default: none
        options:
          - none
          - gdelt
          - cloudflare
          - usgs-gdacs
          - firms
          - fred

permissions:
  contents: write

concurrency:
  group: parallax-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Check out data branch
        uses: actions/checkout@v5
        with:
          ref: data
          path: data-branch

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PARALLAX_FAIL_SOURCE: ${{ inputs.fail_source }}
        run: npm run pipeline -- --output-dir generated-data

      - name: Copy generated data
        run: |
          mkdir -p data-branch/latest data-branch/snapshots
          cp -R generated-data/latest/. data-branch/latest/

      - name: Commit data changes
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest snapshots
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh placeholder output"
            git push origin HEAD:data
          fi
